name: Build, Sync Data & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 每 6 小时自动刷新外部数据并重新部署，保证站点数据及时同步
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect external data (GitHub/HF/PyPI/CSDN RSS)
        run: node scripts/collect-external.mjs

      - name: Fetch resume data (HOS-Qian-jia-hong-resume as database)
        run: node scripts/fetch-resume-data.mjs

      - name: Commit data snapshot
        run: |
          git config user.name "hos-data-bot"
          git config user.email "hos-data-bot@users.noreply.github.com"
          git add public/data/external.json src/data/readme.ts src/data/pr_readme.ts
          git diff --cached --quiet || git commit -m "chore: data snapshot $(date -u +%F)"

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
